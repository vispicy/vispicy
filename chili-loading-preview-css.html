<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chili Animation Preview (CSS) - Vispicy</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 24px;
            padding: 60px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            max-width: 600px;
            width: 100%;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
            text-align: center;
            background: linear-gradient(135deg, #dc2626, #f97316);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 40px;
            font-size: 14px;
        }

        .preview-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
            margin-bottom: 40px;
        }

        .preview-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            padding: 24px;
            background: #f9fafb;
            border-radius: 12px;
            width: 100%;
        }

        .preview-label {
            font-size: 12px;
            font-weight: 600;
            color: #374151;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .loading-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .chili-svg {
            width: 64px;
            height: 64px;
        }

        .chili-svg.sm {
            width: 48px;
            height: 48px;
        }

        .chili-svg.md {
            width: 64px;
            height: 64px;
        }

        .chili-svg.lg {
            width: 128px;
            height: 128px;
        }

        /* CSS 动画关键帧 */
        @keyframes chili-pulse {
            0%, 100% {
                filter: drop-shadow(0 0 0px rgba(220, 38, 38, 0));
            }
            50% {
                filter: drop-shadow(0 4px 8px rgba(220, 38, 38, 0.3));
            }
        }

        @keyframes color-shift {
            0%, 100% {
                fill: #16a34a;
            }
            50% {
                fill: #dc2626;
            }
        }

        @keyframes shine-move {
            0%, 100% {
                cx: 10;
                opacity: 0.7;
            }
            50% {
                cx: 11;
                opacity: 1;
            }
        }

        @keyframes glow-pulse {
            0%, 100% {
                    opacity: 0.2;
                    transform: scale(1);
                }
                50% {
                    opacity: 0.4;
                    transform: scale(1.1);
                }
            }

        /* 应用动画 */
        .chili-svg {
            animation: chili-pulse 2s ease-in-out infinite;
        }

        .chili-body {
            animation: color-shift 2s ease-in-out infinite;
            transform-origin: center;
        }

        .chili-shine {
            animation: shine-move 2s ease-in-out infinite;
        }

        .glow {
            position: absolute;
            inset: -10px;
            background: radial-gradient(circle, rgba(220, 38, 38, 0.3) 0%, transparent 70%);
            border-radius: 50%;
            animation: glow-pulse 2s ease-in-out infinite;
        }

        .text {
            margin-top: 12px;
            font-size: 14px;
            font-weight: 500;
            color: #374151;
            animation: pulse-text 2s ease-in-out infinite;
        }

        @keyframes pulse-text {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.6;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌶️ Vispicy Chili Animation (CSS)</h1>
        <p class="subtitle">Pure CSS animation - Smooth and performant</p>

        <div class="preview-section">
            <!-- 小尺寸 -->
            <div class="preview-item">
                <span class="preview-label">Small (48px)</span>
                <div class="loading-container">
                    <div class="glow"></div>
                    <svg class="chili-svg sm" viewBox="0 0 24 24" fill="none">
                        <!-- Green stem -->
                        <path d="M11 4 L11 1.5" stroke="#16a34a" stroke-width="2" stroke-linecap="round"/>
                        <!-- Green calyx -->
                        <path d="M11 4 L9 5 L8 3.5 L11 4 Z" fill="#16a34a"/>
                        <path d="M11 4 L13 5 L14 3.5 L11 4 Z" fill="#16a34a"/>
                        <path d="M11 4 L11 6" stroke="#16a34a" stroke-width="1.5" stroke-linecap="round"/>
                        <!-- Chili pepper body -->
                        <path class="chili-body" d="M11 6 C9.5 6 8.5 7 8 8.5 C7 11 7.5 14 9 17 C10 19 12 21 13.5 21 C15 21 16.5 19 17 16 C18 12 17.5 9 16 7 C15 6 13 6 11 6Z" fill="#16a34a" stroke="#b91c1c" stroke-width="0.5"/>
                        <!-- Highlight -->
                        <path d="M9.5 9 C9 11 9.5 13 10.5 15" stroke="#fca5a5" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>
                        <!-- Shine spot -->
                        <ellipse class="chili-shine" cx="10" cy="11" rx="0.8" ry="1.2" fill="#fecaca" opacity="0.7"/>
                    </svg>
                </div>
            </div>

            <!-- 中尺寸 -->
            <div class="preview-item">
                <span class="preview-label">Medium (64px)</span>
                <div class="loading-container">
                    <div class="glow"></div>
                    <svg class="chili-svg md" viewBox="0 0 24 24" fill="none">
                        <!-- Green stem -->
                        <path d="M11 4 L11 1.5" stroke="#16a34a" stroke-width="2" stroke-linecap="round"/>
                        <!-- Green calyx -->
                        <path d="M11 4 L9 5 L8 3.5 L11 4 Z" fill="#16a34a"/>
                        <path d="M11 4 L13 5 L14 3.5 L11 4 Z" fill="#16a34a"/>
                        <path d="M11 4 L11 6" stroke="#16a34a" stroke-width="1.5" stroke-linecap="round"/>
                        <!-- Chili pepper body -->
                        <path class="chili-body" d="M11 6 C9.5 6 8.5 7 8 8.5 C7 11 7.5 14 9 17 C10 19 12 21 13.5 21 C15 21 16.5 19 17 16 C18 12 17.5 9 16 7 C15 6 13 6 11 6Z" fill="#16a34a" stroke="#b91c1c" stroke-width="0.5"/>
                        <!-- Highlight -->
                        <path d="M9.5 9 C9 11 9.5 13 10.5 15" stroke="#fca5a5" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>
                        <!-- Shine spot -->
                        <ellipse class="chili-shine" cx="10" cy="11" rx="0.8" ry="1.2" fill="#fecaca" opacity="0.7"/>
                    </svg>
                    <p class="text">Generating...</p>
                </div>
            </div>

            <!-- 大尺寸 -->
            <div class="preview-item">
                <span class="preview-label">Large (128px)</span>
                <div class="loading-container">
                    <div class="glow"></div>
                    <svg class="chili-svg lg" viewBox="0 0 24 24" fill="none">
                        <!-- Green stem -->
                        <path d="M11 4 L11 1.5" stroke="#16a34a" stroke-width="2" stroke-linecap="round"/>
                        <!-- Green calyx -->
                        <path d="M11 4 L9 5 L8 3.5 L11 4 Z" fill="#16a34a"/>
                        <path d="M11 4 L13 5 L14 3.5 L11 4 Z" fill="#16a34a"/>
                        <path d="M 11 4 L11 6" stroke="#16a34a" stroke-width="1.5" stroke-linecap="round"/>
                        <!-- Chili pepper body -->
                        <path class="chili-body" d="M11 6 C9.5 6 8.5 7 8 8.5 C7 11 7.5 14 9 17 C10 19 12 21 13.5 21 C15 21 16.5 19 17 16 C18 12 17.5 9 16 7 C15 6 13 6 11 6Z" fill="#16a34a" stroke="#b91c1c" stroke-width="0.5"/>
                        <!-- Highlight -->
                        <path d="M9.5 9 C9 11 9.5 13 10.5 15" stroke="#fca5a5" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>
                        <!-- Shine spot -->
                        <ellipse class="chili-shine" cx="10" cy="11" rx="0.8" ry="1.2" fill="#fecaca" opacity="0.7"/>
                    </svg>
                    <p class="text">AI is working...</p>
                </div>
            </div>
        </div>

        <p style="text-align: center; color: #999; font-size: 12px;">
            ↑ 纯 CSS 动画，兼容性好
        </p>
    </div>
</body>
</html>
